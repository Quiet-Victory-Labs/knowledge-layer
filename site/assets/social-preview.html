<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Knowledge Layer social preview artwork</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #101c2f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      body { display: grid; grid-template-columns: 650px 390px; gap: 40px; align-items: center; padding: 60px; }
      h1 { margin: 0; font-size: 72px; line-height: 1.08; font-weight: 750; letter-spacing: -0.052em; }
      .brand { margin: 0 0 30px; font-size: 27px; font-weight: 740; letter-spacing: -0.04em; }
      .scope { margin: 30px 0 0; color: #566780; font-size: 23px; line-height: 1.4; }
      img { width: 390px; height: 390px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div>
      <p class="brand">Knowledge Layer</p>
      <h1>Give your agents context they can trace.</h1>
      <p class="scope">Open source · Self-hosted · Apache 2.0</p>
    </div>
    <img src="knowledge-layer-logo.jpg" width="390" height="390" alt="Knowledge Layer geometric mark" />
  </body>
</html>
